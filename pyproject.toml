[project]
name = "untrusted-rows"
version = "0.1.0"
description = "A DuckDB MCP server that treats the rows it returns as untrusted input, plus the measurement of what that costs in false positives on real database text"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly, all three. The refusal list in tests/fixtures/refusals.json
    # is a statement about what one parser build rejects, and sqlglot's DuckDB
    # dialect gains keywords between minor releases, so a range would let a
    # committed expectation drift without the lockfile recording it. Same
    # argument for duckdb: which statements the read-only connection refuses at
    # execution time is version behaviour, not a stable contract.
    "duckdb==1.5.5",
    "sqlglot==30.18.0",
    "mcp==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Enforces constraint 4 rather than trusting it: --disable-socket makes any
    # accidental network call a test failure. This project makes no model calls
    # at all, so the flag is the whole of the enforcement.
    "pytest-socket>=0.7.0",
    "ruff>=0.6.0",
]

[project.scripts]
untrusted-rows = "untrusted_rows.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/untrusted_rows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# BLE catches the blanket `except Exception` that a timeout path invites.
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
