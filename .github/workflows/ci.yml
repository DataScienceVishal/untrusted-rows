name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # No model-call environment here on purpose. The factory template sets
    # LLM_PROVIDER and LLM_STUB_STRICT for the stub adapter, and this project
    # has no adapter to configure: it makes no model calls at all, so there is
    # nothing for a stub to stand in for. The README says there is no
    # AZURE_OPENAI_* anywhere and those two variables made that untrue of the
    # repository if not of the code. `--disable-socket` below is what enforces
    # constraint 4 here.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Style fingerprint
        run: uv run python scripts/check_fingerprint.py

      - name: Tests with the network switched off
        # --disable-socket is what turns "no API calls" from a claim into a
        # property the CI enforces. Unix sockets stay open for local subprocesses.
        run: uv run pytest --disable-socket --allow-unix-socket -q
